name: Generate GitHub Stats SVGs

on:
  schedule:
    # Roda a cada 12 horas
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Gera a imagem das Linguagens
      - name: Generate Languages SVG
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          filename: languages.svg
          base: ""
          plugin_languages: yes
          plugin_languages_colors: github
          plugin_languages_limit: 6
          plugin_languages_sections: most-used
          output_action: commit
          committer_branch: languages-output
          committer_message: "chrono: update languages svg"

      # Gera a imagem dos Stats
      - name: Generate Stats SVG
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          filename: stats.svg
          base: header, activity, community, repositories
          output_action: commit
          committer_branch: stats-output
          committer_message: "chrono: update stats svg"
